name: Build PixelMusic APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PixelMusic_v0.2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PixelMusic project
        run: |
          mkdir project
          unzip -q PixelMusic_v0.2.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms/android-36"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelMusic-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
